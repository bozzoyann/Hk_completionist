<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="L-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2c3a66"/><stop offset=".55" stop-color="#141a2c"/><stop offset="1" stop-color="#0a0c14"/>
    </radialGradient>
    <radialGradient id="L-halo" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity=".55"/><stop offset=".45" stop-color="#8fa8ff" stop-opacity=".18"/><stop offset="1" stop-color="#8fa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="L-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e8"/><stop offset=".5" stop-color="#9fb0e0"/><stop offset="1" stop-color="#e9e6dc"/>
    </linearGradient>
    <radialGradient id="L-mask" cx="42%" cy="34%" r="80%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ebeef5"/><stop offset="1" stop-color="#b3bbd0"/>
    </radialGradient>
    <linearGradient id="L-cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323a5e"/><stop offset=".6" stop-color="#1c2238"/><stop offset="1" stop-color="#0f1322"/>
    </linearGradient>
    <linearGradient id="L-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f6fa"/><stop offset="1" stop-color="#8e97ad"/>
    </linearGradient>
    <clipPath id="L-disc"><circle cx="60" cy="64" r="44"/></clipPath>
  </defs>

  <!-- outer ornament -->
  <circle cx="60" cy="64" r="53" fill="none" stroke="#8fa8ff" stroke-opacity=".25" stroke-width="1"/>
  <g fill="#e9e6dc">
    <path d="M60 6 l3.2 6.5 -3.2 3 -3.2 -3z"/>
    <path d="M60 122 l3.2 -6.5 -3.2 -3 -3.2 3z" transform="translate(0 -2)"/>
    <path d="M2 64 l6.5 -3.2 3 3.2 -3 3.2z" transform="translate(5 0)"/>
    <path d="M118 64 l-6.5 -3.2 -3 3.2 3 3.2z" transform="translate(-5 0)"/>
  </g>

  <!-- disc -->
  <circle cx="60" cy="64" r="44" fill="url(#L-bg)"/>
  <g clip-path="url(#L-disc)">
    <circle cx="60" cy="58" r="40" fill="url(#L-halo)"/>
    <!-- soul motes -->
    <g fill="#dfe8ff">
      <circle cx="30" cy="48" r="1.1" opacity=".8"/><circle cx="88" cy="42" r="1.4" opacity=".7"/>
      <circle cx="94" cy="70" r=".9" opacity=".6"/><circle cx="26" cy="76" r="1" opacity=".5"/>
      <circle cx="40" cy="30" r=".8" opacity=".6"/><circle cx="80" cy="28" r=".8" opacity=".6"/>
    </g>
    <!-- nail behind -->
    <g transform="rotate(-38 60 64)">
      <rect x="58.2" y="20" width="3.6" height="70" rx="1.6" fill="url(#L-blade)"/>
      <rect x="54" y="88" width="12" height="3" rx="1.5" fill="#cfd5e4"/>
      <rect x="58.6" y="90" width="2.8" height="11" rx="1.2" fill="#6e7690"/>
    </g>
    <!-- cloak -->
    <path d="M46 80 C38 82 31 88 27 96 C24 102 22.5 108 22 116 L98 116 C97.5 108 96 102 93 96 C89 88 82 82 74 80 C69 83 64.5 84.5 60 84.5 C55.5 84.5 51 83 46 80 Z"
      fill="url(#L-cloak)" stroke="#7d8fd0" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M38 92 C35.5 100 34.5 108 35 116 M82 92 C84.5 100 85.5 108 85 116 M60 88 C59 98 59.5 107 60 116"
      fill="none" stroke="#4a5690" stroke-width="1.3" stroke-linecap="round" opacity=".9"/>
    <path d="M46 80 C51 83 55.5 84.5 60 84.5 C64.5 84.5 69 83 74 80" fill="none" stroke="#aebcf0" stroke-width="1" opacity=".6"/>
  </g>
  <circle cx="60" cy="64" r="44" fill="none" stroke="url(#L-ring)" stroke-width="3"/>
  <circle cx="60" cy="64" r="40.5" fill="none" stroke="#e9e6dc" stroke-opacity=".18" stroke-width="1"/>

  <!-- mask -->
  <g transform="translate(28 4)">
    <path fill="url(#L-mask)" stroke="#0a0c14" stroke-width="2" stroke-linejoin="round"
      d="M20.2 37 C10.6 31 7.2 17.5 11.2 2.6 C13.8 12.6 18.6 21.4 26.6 28 C28.4 27.4 30.2 27.1 32 27.1 C33.8 27.1 35.6 27.4 37.4 28 C45.4 21.4 50.2 12.6 52.8 2.6 C56.8 17.5 53.4 31 43.8 37 C45.5 40 46.4 43.4 46.4 47 C46.4 57.8 40 66.4 32 66.4 C24 66.4 17.6 57.8 17.6 47 C17.6 43.4 18.5 40 20.2 37 Z"/>
    <path d="M13.4 9.5 C15 16.5 18.6 23 24.2 28" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
    <path d="M22 41 C24 38.5 27 37.5 29.5 38" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="25.5" cy="49" rx="4.6" ry="7.6" fill="#0a0c14" transform="rotate(7 25.5 49)"/>
    <ellipse cx="38.5" cy="49" rx="4.6" ry="7.6" fill="#0a0c14" transform="rotate(-7 38.5 49)"/>
    <ellipse cx="24.3" cy="45.8" rx="1.2" ry="2" fill="#9fb4ff" opacity=".6"/>
    <ellipse cx="37.3" cy="45.8" rx="1.2" ry="2" fill="#9fb4ff" opacity=".6"/>
  </g>
</svg>
